<div class="product-detail-container" *ngIf="product">
  <div class="product-image">
    <img [src]="product.image" [alt]="product.name">
  </div>
  <div class="product-info">
    <h1>{{ product.name }}</h1>
    <div class="price">{{ product.price | currency:'USD':'symbol':'1.0-0' }}</div>
    <p class="description">{{ product.description }}</p>
    
    <div class="quantity-selector">
      <button mat-icon-button (click)="decreaseQuantity()">
        <mat-icon>remove</mat-icon>
      </button>
      <span class="quantity">{{ quantity }}</span>
      <button mat-icon-button (click)="increaseQuantity()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
    
    <button mat-raised-button color="primary" class="add-to-cart-btn" (click)="addToCart()">
      Add to Cart
    </button>
  </div>
</div>

<div *ngIf="!product">
  <mat-spinner></mat-spinner>
  <p>Loading product...</p>
</div>
